title: "Eldur Studio"
url: "https://eldur.studio"
baseurl: ""
permalink: /resources/:slug/
twitter_username: eldur_studio
exclude: [README.md, AGENTS.md, CLAUDE.md, DEPLOYMENT.md, scripts/, package.json, package-lock.json, node_modules/, docs/, tests/, playwright.config.js, playwright.release.config.js, release-playwright-report/, release-test-results/, playwright-report/, test-results/, blob-report/]
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
